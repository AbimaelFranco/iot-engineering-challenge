{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IoT Admin{% endblock %}</title>

  <!-- SEO Optimization -->
  <meta name="description" content="IoT Admin - plataforma de monitoreo y control de nodos IoT">
  <meta name="author" content="IoT Admin">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'assets/images/favicon.ico' %}">

  <!-- Local Third-Party Libraries (100% Offline Compatible) -->
  <link rel="stylesheet" href="{% static 'assets/libs/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/libs/bootstrap-icons/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'assets/libs/apexcharts/apexcharts.css' %}">
  <link rel="stylesheet" href="{% static 'assets/libs/flatpickr/flatpickr.min.css' %}">

  <!-- Main Design System & Custom Stylesheet -->
  <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body>

  <!-- Reusable SVG pattern for chart danger-zone shading (out-of-range areas) -->
  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <pattern id="dangerHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="transparent"></rect>
        <line x1="0" y1="0" x2="0" y2="8" stroke="#EF4444" stroke-width="3"></line>
      </pattern>
    </defs>
  </svg>

  {% include 'partials/sidebar.html' %}

  <!-- ==========================================
         START: Main Content Area
         ========================================== -->
  <div class="main-wrapper">

    {% include 'partials/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'partials/footer.html' %}

  </div>
  <!-- ==========================================
         END: Main Content Area
         ========================================== -->

  <!-- Local Third-Party Libraries Script dependencies -->
  <script src="{% static 'assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/libs/apexcharts/apexcharts.min.js' %}"></script>
  <script src="{% static 'assets/libs/flatpickr/flatpickr.min.js' %}"></script>
  <script src="{% static 'assets/libs/flatpickr/l10n/es.js' %}"></script>

  <!-- Local dashboard interactions controller -->
  <script src="{% static 'assets/js/dashboard.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>
