{% load static %}
<!-- ==========================================
       START: Sidebar Component
       Highly polished, dark-green sticky navigation
       ========================================== -->
<div class="sidebar-wrapper" id="sidebar">
  <!-- Brand Logo / Identity -->
  <a href="{% url 'home' %}" class="sidebar-brand">
    <i class="bi bi-asterisk"></i>
    <span>IoT Admin</span>
  </a>

  <!-- Navigation Menu -->
  <div class="flex-grow-1 overflow-y-auto">
    <!-- Group: Menu -->
    <div class="sidebar-menu-section">
      <div class="sidebar-menu-title">Menu</div>
      <ul class="sidebar-menu-list">
        <li class="sidebar-menu-item">
          <a href="{% url 'home' %}"
            class="sidebar-menu-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}"
            id="menu-dashboard" title="Dashboard">
            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="{% url 'tiemporeal' %}"
            class="sidebar-menu-link{% if request.resolver_match.url_name == 'tiemporeal' %} active{% endif %}"
            id="menu-realtime" title="Datos en tiempo real">
            <i class="bi bi-activity"></i>
            <span>Datos en tiempo real</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="{% url 'historico' %}"
            class="sidebar-menu-link{% if request.resolver_match.url_name == 'historico' %} active{% endif %}"
            id="menu-historico" title="Datos historicos">
            <i class="bi bi-clock-history"></i>
            <span>Datos historicos</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link" id="menu-configuracion" title="Configuracion">
            <i class="bi bi-gear-fill"></i>
            <span>Configuracion</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link" id="menu-terminal" title="Terminal">
            <i class="bi bi-terminal-fill"></i>
            <span>Terminal</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Sidebar Profile Card (Dynamic Footer) -->
  <div class="sidebar-profile">
    <img src="{% static 'assets/images/avatar.png' %}" alt="Administrator" class="sidebar-profile-img"
      onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=256&auto=format&fit=crop'">
    <div class="sidebar-profile-info">
      <div class="sidebar-profile-name">Administrator</div>
      <div class="sidebar-profile-email">admin@email.com</div>
    </div>
  </div>
</div>
<!-- ==========================================
       END: Sidebar Component
       ========================================== -->
